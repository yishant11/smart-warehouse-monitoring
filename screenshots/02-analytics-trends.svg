<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="675" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <rect x="20" y="20" width="36" height="36" rx="10" fill="url(#brandGrad)" />
  <text x="68" y="38" fill="#ffffff" font-family="Outfit, sans-serif" font-size="16" font-weight="800">SmartWarehouse</text>
  <text x="68" y="52" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1">TELEMETRY OPS</text>

  <!-- Sidebar Nav Links -->
  <g transform="translate(15, 90)">
    <rect x="0" y="0" width="190" height="40" rx="10" fill="transparent" />
    <text x="40" y="25" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">Dashboard Overview</text>
    
    <!-- Active Item -->
    <rect x="0" y="50" width="190" height="40" rx="10" fill="#4f46e5" />
    <text x="40" y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">Analytics &amp; Trends</text>
    
    <rect x="0" y="100" width="190" height="40" rx="10" fill="transparent" />
    <text x="40" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">Alerts &amp; Incidents</text>
    
    <rect x="0" y="150" width="190" height="40" rx="10" fill="transparent" />
    <text x="40" y="175" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">System Settings</text>

    <rect x="0" y="200" width="190" height="40" rx="10" fill="transparent" />
    <text x="40" y="225" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500">Profile &amp; Session</text>
  </g>

  <!-- Top Navbar -->
  <rect x="220" y="0" width="980" height="65" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="1140" cy="32" r="16" fill="url(#brandGrad)" />
  <text x="1134" y="37" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="800">AO</text>

  <!-- Main Content Header & Filters -->
  <text x="245" y="105" fill="#ffffff" font-family="Outfit, sans-serif" font-size="20" font-weight="800">Historical Trends &amp; Predictive Analytics</text>
  <text x="245" y="123" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Aggregated time-series modeling for warehouse thermal dynamics &amp; machine load</text>

  <!-- Time Range Chips (1H, 6H, 24H, 7D) -->
  <g transform="translate(850, 95)">
    <rect x="0" y="0" width="40" height="30" rx="8" fill="#1e293b" />
    <text x="12" y="19" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700">1H</text>

    <rect x="45" y="0" width="40" height="30" rx="8" fill="#1e293b" />
    <text x="57" y="19" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700">6H</text>

    <rect x="90" y="0" width="45" height="30" rx="8" fill="#4f46e5" />
    <text x="100" y="19" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="800">24H</text>

    <rect x="140" y="0" width="40" height="30" rx="8" fill="#1e293b" />
    <text x="152" y="19" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700">7D</text>
  </g>

  <!-- Chart 1: Multi-Zone Thermal Profiles -->
  <rect x="245" y="150" width="445" height="490" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="265" y="180" fill="#ffffff" font-family="Outfit, sans-serif" font-size="15" font-weight="800">Zone Temperature Profiles (°C)</text>
  <text x="265" y="198" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Comparative timeline across warehouse cooling sectors</text>

  <!-- Multi-line chart paths -->
  <!-- Zone A (Cold Storage) -->
  <path d="M 270 560 L 330 555 L 390 562 L 450 558 L 510 560 L 570 557 L 630 560 L 660 558" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Zone B (Robotics) -->
  <path d="M 270 420 L 330 430 L 390 410 L 450 425 L 510 415 L 570 420 L 630 405 L 660 410" fill="none" stroke="#6366f1" stroke-width="2.5" />
  <!-- Zone C (Conveyors) -->
  <path d="M 270 340 L 330 350 L 390 320 L 450 360 L 510 330 L 570 310 L 630 340 L 660 325" fill="none" stroke="#f43f5e" stroke-width="2.5" />
  <!-- Zone D (Cargo Dock) -->
  <path d="M 270 400 L 330 390 L 390 405 L 450 395 L 510 410 L 570 385 L 630 395 L 660 390" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Legend -->
  <g transform="translate(265, 605)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8" />
    <text x="15" y="9" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Zone A (Cold)</text>

    <circle cx="110" cy="5" r="4" fill="#6366f1" />
    <text x="120" y="9" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Zone B (Robotics)</text>

    <circle cx="230" cy="5" r="4" fill="#f43f5e" />
    <text x="240" y="9" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Zone C (Conveyors)</text>

    <circle cx="350" cy="5" r="4" fill="#f59e0b" />
    <text x="360" y="9" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Zone D (Dock)</text>
  </g>

  <!-- Chart 2: Throughput Bars -->
  <rect x="705" y="150" width="445" height="490" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="725" y="180" fill="#ffffff" font-family="Outfit, sans-serif" font-size="15" font-weight="800">Active Units vs Hourly Throughput</text>
  <text x="725" y="198" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Logistics parcel routing velocity vs active units</text>

  <!-- Bars -->
  <g transform="translate(730, 240)">
    <rect x="20" y="120" width="22" height="200" rx="4" fill="#6366f1" />
    <rect x="48" y="80" width="22" height="240" rx="4" fill="#10b981" />

    <rect x="100" y="140" width="22" height="180" rx="4" fill="#6366f1" />
    <rect x="128" y="100" width="22" height="220" rx="4" fill="#10b981" />

    <rect x="180" y="90" width="22" height="230" rx="4" fill="#6366f1" />
    <rect x="208" y="50" width="22" height="270" rx="4" fill="#10b981" />

    <rect x="260" y="110" width="22" height="210" rx="4" fill="#6366f1" />
    <rect x="288" y="70" width="22" height="250" rx="4" fill="#10b981" />

    <rect x="340" y="130" width="22" height="190" rx="4" fill="#6366f1" />
    <rect x="368" y="90" width="22" height="230" rx="4" fill="#10b981" />
  </g>
</svg>
